name: Publish Android Auto release

# Builds the APK and publishes it as a GitHub release whenever an Android Auto version tag is
# pushed, e.g.  git tag auto-v1.17.1-1 && git push origin auto-v1.17.1-1
# The release page then has a direct download link that needs no GitHub account and never expires.
#
# The "auto-v" prefix keeps this apart from release.yml, which is upstream NewTube's release
# pipeline (it fires on "v*" tags and needs upstream's signing key). A release created here with
# GITHUB_TOKEN does not start the other "release published" workflows (Discord, website, update
# feed, VirusTotal), which belong to upstream NewTube.
on:
  push:
    tags: [ 'auto-v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Use the fork's signing key
        # The same key signs every release, so each one installs over the last and keeps the
        # user's data. It lives only in the repository's secrets (see docs/RELEASING.md).
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUTO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The signing key is missing. Add the four AUTO_* secrets: see docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/newtube-auto.jks"
          {
            echo "storeFile=$RUNNER_TEMP/newtube-auto.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build APK
        run: ./gradlew :smarttubetv:assembleStmobileRelease --no-daemon

      - name: Give the files clear names
        # Fixed names, so ".../releases/latest/download/<name>" always points at the newest file.
        run: |
          mkdir -p dist installer
          OUT=smarttubetv/build/outputs/apk/stmobile/release
          ls -la "$OUT"
          cp "$OUT/smarttubetv-stmobile-arm64-v8a-release.apk"   dist/NewTube-Android-Auto-arm64-v8a.apk
          cp "$OUT/smarttubetv-stmobile-armeabi-v7a-release.apk" dist/NewTube-Android-Auto-armeabi-v7a.apk
          cp "$OUT/smarttubetv-stmobile-universal-release.apk"   dist/NewTube-Android-Auto-universal.apk
          # Computer installer: the app plus the scripts, ready to double-click.
          cp scripts/android-auto/Install.bat scripts/android-auto/install.ps1 scripts/android-auto/install.sh installer/
          cp dist/NewTube-Android-Auto-arm64-v8a.apk installer/
          (cd installer && zip -q -r ../dist/NewTube-Android-Auto-computer-installer.zip .)
          ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: NewTube for Android Auto ${{ github.ref_name }}
          body: |
            ![NewTube on the car screen](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docs/images/android-auto/car-player.jpg)

            **New here? Follow the simple guide:**
            [English](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALL.md) ·
            [Português](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALL.pt.md)

            **Which file do I need?**
            - On the phone: **NewTube-Android-Auto-arm64-v8a.apk** (almost every phone from the
              last few years). Very old phone: *armeabi-v7a*. Not sure: *universal* (bigger).
            - On a computer, if NewTube does not show up in the car:
              **NewTube-Android-Auto-computer-installer.zip** (unzip it and double-click
              `Install.bat` on Windows, or run `install.sh` on a Mac or Linux).

            **Updating?** Every release is signed with the same key, so it installs over the
            previous one and keeps your settings. Coming from an early test build? That one is a
            separate app: uninstall it after installing this one.

            Passenger use only. The driver must not watch video while driving.
          files: dist/*
