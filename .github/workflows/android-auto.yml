name: Build Android Auto debug APK

on:
  push:
    branches: [ main, android-auto-passenger-video ]
  pull_request:
    branches: [ main, android-auto-passenger-video ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Build debug APK
        run: ./gradlew :smarttubetv:assembleStmobileDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: newtube-android-auto-debug
          path: |
            smarttubetv/build/outputs/apk/stmobile/debug/*.apk
            smarttubetv/build/outputs/renamed_apks/stmobileDebug/*.apk
          if-no-files-found: error
