name: Publish Android Auto release

# Builds the APK and publishes it as a GitHub release whenever an Android Auto version tag is
# pushed, e.g.  git tag auto-v1.17.1-1 && git push origin auto-v1.17.1-1
# The release page then has a direct download link that needs no GitHub account and never expires.
#
# The "auto-v" prefix keeps this apart from release.yml, which is upstream NewTube's release
# pipeline (it fires on "v*" tags and needs upstream's signing key). A release created here with
# GITHUB_TOKEN does not start the other "release published" workflows (Discord, website, update
# feed, VirusTotal), which belong to upstream NewTube.
on:
  push:
    tags: [ 'auto-v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Build APK
        run: ./gradlew :smarttubetv:assembleStmobileDebug --no-daemon

      - name: Give the APKs clear names
        run: |
          mkdir -p dist
          OUT=smarttubetv/build/outputs/apk/stmobile/debug
          TAG="${GITHUB_REF_NAME}"
          cp "$OUT/smarttubetv-stmobile-arm64-v8a-debug.apk"   "dist/NewTube-Android-Auto-${TAG}-arm64-v8a.apk"
          cp "$OUT/smarttubetv-stmobile-armeabi-v7a-debug.apk" "dist/NewTube-Android-Auto-${TAG}-armeabi-v7a.apk"
          cp "$OUT/smarttubetv-stmobile-universal-debug.apk"   "dist/NewTube-Android-Auto-${TAG}-universal.apk"
          ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: NewTube for Android Auto ${{ github.ref_name }}
          body: |
            **Which file do I need?**
            - Most phones from the last few years (Pixel, Samsung Galaxy S/A, Xiaomi...): **arm64-v8a**.
            - Older 32-bit phones: **armeabi-v7a**.
            - Not sure: **universal** (bigger, works on every phone).

            **How to install so that Android Auto accepts it**
            Android Auto only shows apps that look as if they came from Google Play. A normal
            install from a browser or file manager may not appear in the car. See
            [docs/ANDROID_AUTO.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/ANDROID_AUTO.md)
            and the README for the steps (Android Auto developer settings and installing with
            Google Play as the source).

            **Updating from an older build**
            These APKs are signed by GitHub's build machine. If your current NewTube was built
            somewhere else, Android will refuse to update it: uninstall the old one first (this
            clears NewTube's settings and sign-in).

            Passenger use only. The driver must not watch video while driving.
          files: dist/*.apk
